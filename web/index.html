<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题目列表 - OJ-Anti-AI</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="container">
  <div class="card">
    <h1>题目列表</h1>
    <p class="muted">
      自研简易评测页：进入题目后可在「原始 / 机制一（同构多版本）/ 机制二（干扰注入 / 约束隐藏）/ 组合」之间切换防护状态。
      判题采用受限子进程执行 + 隐藏测试数据比对。
    </p>
    <div id="stat" class="muted" style="margin-bottom:14px">加载中…</div>
    <table class="tbl">
      <thead><tr>
        <th style="width:90px">编号</th><th>标题</th><th style="width:80px">难度</th>
        <th>标签</th><th class="num" style="width:100px">时限</th>
        <th>同构版本</th><th class="num" style="width:130px">测试点</th><th style="width:90px"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script src="static/common.js?v=23"></script>
<script>
renderNav("problems");
(async () => {
  const data = await App.api("/api/problems");
  const ps = data.problems;
  document.getElementById("stat").innerHTML =
    `共 <b>${ps.length}</b> 道自拟题目 · 每题 <b>3</b> 个同构版本 · 防护状态 P0 / P1 / P2 / P3`;
  document.getElementById("rows").innerHTML = ps.map(p => `
    <tr>
      <td class="mono">${App.esc(p.id)}</td>
      <td><a href="problem.html?id=${p.id}"><b>${App.esc(p.title)}</b></a></td>
      <td>${App.badgeDifficulty(p.difficulty)}</td>
      <td>${p.tags.map(t => `<span class="badge tag">${App.esc(t)}</span>`).join("")}</td>
      <td class="num mono">${(p.time_limit_ms / 1000).toFixed(1)}s</td>
      <td class="muted">${p.variant_labels.map(App.esc).join(" / ")}</td>
      <td class="num mono">${p.test_count} × 3 版本</td>
      <td><a class="btn" style="padding:5px 14px;font-size:13px" href="problem.html?id=${p.id}">进入</a></td>
    </tr>`).join("");
})().catch(e => App.toast("加载失败: " + e.message));
</script>
</body>
</html>
